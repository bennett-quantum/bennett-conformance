# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-conformance"
tool_sha = "822aaeffab369114e1a719a7b887a0192b22d386"
timeout_s = 14400

# Paths no check reads; changing only these reuses a PASS receipt (bennett/tools/gate_README.md).
[receipt]
non_product = [".beads/", "worklog/", "CLAUDE.md", "AGENTS.md"]

[env]
BENNETT_ISA_SPEC = "{sibling:bennett-isa-spec}"
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"
BENNETT_ISA_BINARY = "{sibling:bennett-isa-spec}/reference-interpreter/target/release/bennett-isa-ref"

[[check]]
name = "cargo test (every crate)"
argv = ["sh", "-c", "for m in $(find . -name Cargo.toml -not -path './.tmp/*' -not -path '*/target/*' | sort); do echo \"cargo test $m\"; cargo test --offline --manifest-path \"$m\" || exit $?; done"]

[[check]]
name = "clause-graph tests"
argv = ["python3", "-I", "-m", "unittest", "discover", "-s", "clauses/tests"]

[[check]]
name = "suite tests"
argv = ["python3", "-I", "-m", "unittest", "discover", "-s", "suite/tests"]

[[check]]
name = "neutral suite"
argv = ["sh", "-c", "python3 -I suite/run.py --binary \"$BENNETT_ISA_BINARY\" --cases suite/cases"]

[[check]]
name = "quality baseline ratchet"
argv = ["sh", "-c", "python3 -B scripts/quality_ratchet.py --self-test && python3 -B scripts/quality_ratchet.py"]

[siblings."bennett-isa-spec"]
sha = "b472bac28d9f69037d2cf89763c8c9603e7e4fb4"
note = "Published ISA 0.9 with closed image preparation/process domains and native models; shared test and neutral-suite pin"

[[siblings."bennett-isa-spec".build]]
name = "reference interpreter (release)"
cwd = "reference-interpreter"
argv = ["cargo", "build", "--offline", "--release", "-j3"]
outputs = ["reference-interpreter/target/release/bennett-isa-ref"]
env = { CARGO_BUILD_JOBS = "3" }

