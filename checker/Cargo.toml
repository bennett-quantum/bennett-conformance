[package]
name = "bennett-cert-checker"
version = "0.0.0"
edition = "2021"
autotests = false
description = "Independent certificate checker for Bennett ISA-spec certificates (ISA section 12)"
license-file = "../LICENSE"

[[bin]]
name = "bennett-check"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
ryu-js = "1.0.3"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[profile.test]
debug = "line-tables-only"
